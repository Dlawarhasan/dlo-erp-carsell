<!doctype html>
<html lang="ckb" dir="rtl" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="پێشانگا" />
    <title>DLO ERP — سیستەمی پێشانگای ئۆتۆمبێل</title>
    <script>
      try {
        /* بنەڕەت = ڕووناک. تەنها ئەگەر بەکارهێنەر خۆی گۆڕیبێتی، هەڵبژاردنەکەی دەمێنێتەوە */
        var t = localStorage.getItem('gm.theme') || 'light'
        document.documentElement.className = 'theme-' + t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#090D12' : '#F5F7FA')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
